<!doctype html>
<html lang="he" dir="rtl" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The site ships its own curated HE/EN/FR translations (language toggle).
         Block browser machine translation, which butchers liturgical terms
         (e.g. ערבית -> "Arabic" instead of "Arvit"). -->
    <meta name="google" content="notranslate" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="זמני השבת" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>זמני השבת - קהילת אורות ישראל</title>
    <meta name="description" content="זמני כניסת ויציאת שבת, פרשה, מולד, תפילות וזמני היום — מדויק לכל מיקום, גם בלי אינטרנט." />
    <!-- Open Graph — nice link preview when shared to WhatsApp / community groups. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="זמני השבת — קהילת אורות ישראל" />
    <meta property="og:description" content="זמני כניסת ויציאת שבת, פרשה, תפילות וזמני היום — מדויק לכל מיקום." />
    <meta property="og:image" content="logo.jpg" />
    <meta property="og:locale" content="he_IL" />
    <!-- The app shell is cached hard (it has to work offline), so a bundle that
         fails to load once can keep a device on a blank page indefinitely. If
         a script never loads, drop the caches and reload — once per visit, so
         a genuinely broken build can't put the page in a reload loop. -->
    <script data-cfasync="false">
      window.addEventListener('error', function (e) {
        var el = e.target;
        if (!el || el.tagName !== 'SCRIPT' || !el.src) return;
        try {
          if (sessionStorage.getItem('shell-recovered')) return;
          sessionStorage.setItem('shell-recovered', '1');
        } catch (_) { return; }
        var jobs = [];
        if (window.caches) jobs.push(caches.keys().then(function (keys) {
          return Promise.all(keys.map(function (k) { return caches.delete(k); }));
        }));
        if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (r) { return r.unregister(); }));
        }));
        var reload = function () { location.reload(); };
        Promise.all(jobs).then(reload, reload);
      }, true);
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Frank+Ruhl+Libre:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
