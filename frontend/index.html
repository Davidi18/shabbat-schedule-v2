<!doctype html>
<html lang="he" dir="rtl" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The site ships its own curated HE/EN/FR translations (language toggle).
         Block browser machine translation, which butchers liturgical terms
         (e.g. ערבית -> "Arabic" instead of "Arvit"). -->
    <meta name="google" content="notranslate" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="זמני השבת" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>זמני השבת - קהילת אורות ישראל</title>
    <meta name="description" content="זמני השבת ושעות התפילה בבית הכנסת האשכנזי, הר חומה שלב ג׳" />
    <!-- Open Graph — nice link preview when shared to WhatsApp / community groups. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="זמני השבת — קהילת אורות ישראל" />
    <meta property="og:description" content="זמני השבת ושעות התפילה בבית הכנסת האשכנזי, הר חומה שלב ג׳" />
    <meta property="og:image" content="logo.jpg" />
    <meta property="og:locale" content="he_IL" />
    <!-- The app shell is cached hard (it has to work offline), so a bundle that
         fails to load once can keep a device on a blank page indefinitely. If
         a script never loads, drop the caches and reload — once per visit, so
         a genuinely broken build can't put the page in a reload loop. -->
    <script data-cfasync="false">
      window.addEventListener('error', function (e) {
        var el = e.target;
        if (!el || el.tagName !== 'SCRIPT' || !el.src) return;
        try {
          if (sessionStorage.getItem('shell-recovered')) return;
          sessionStorage.setItem('shell-recovered', '1');
        } catch (_) { return; }
        var jobs = [];
        if (window.caches) jobs.push(caches.keys().then(function (keys) {
          return Promise.all(keys.map(function (k) { return caches.delete(k); }));
        }));
        if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (r) { return r.unregister(); }));
        }));
        var reload = function () { location.reload(); };
        Promise.all(jobs).then(reload, reload);
      }, true);
    </script>
    <!-- Register the service worker ourselves. The generated registration
         only calls register(): the new worker installs, claims the page and
         caches the new build, but the document already on screen keeps the
         old bundle, so every returning visitor saw week-old times for
         exactly one visit. Reloading on controllerchange closes that gap. -->
    <script data-cfasync="false">
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          // A controller already present means this page is being served by an
          // older worker; when a newer one claims it, what we painted is stale.
          // With no controller this is a first install and there is nothing to
          // replace, so claiming must not trigger a reload.
          var hadController = !!navigator.serviceWorker.controller;
          navigator.serviceWorker.addEventListener('controllerchange', function () {
            // The first claim of a page that opened with no worker is an
            // install, not a replacement: adopt it quietly. Reloading here
            // would reload every first-ever visit; skipping it for good would
            // leave that tab unable to notice a later build.
            if (!hadController) { hadController = true; return; }
            try {
              // Once per visit, so a build that somehow keeps claiming can't
              // put the page in a reload loop.
              if (sessionStorage.getItem('sw-reloaded')) return;
              sessionStorage.setItem('sw-reloaded', '1');
            } catch (_) { return; }
            location.reload();
          });
          navigator.serviceWorker
            .register('./sw.js', { scope: './', updateViaCache: 'none' })
            .then(function (reg) {
              // Phones keep the PWA suspended for days. Re-check on the way
              // back in, or a resumed app never learns a new build exists.
              document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'visible') reg.update();
              });
            })
            .catch(function () { /* no service worker: the page still works */ });
        });
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Frank+Ruhl+Libre:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
