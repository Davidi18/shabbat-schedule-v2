<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>ניהול · זמני השבת</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f4f1ea; --card:#fff; --ink:#2b2b45; --muted:#8b8397; --line:#e6e0d3; --gold:#b98a2e; --primary:#1a1a2e; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:'Rubik',sans-serif; padding:20px; }
    .wrap { max-width:640px; margin:0 auto; }
    h1 { font-size:1.4rem; margin:6px 0 2px; }
    .sub { color:var(--muted); font-size:0.9rem; margin-bottom:18px; line-height:1.5; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:16px; box-shadow:0 2px 10px rgba(20,20,50,.04); }
    .field { margin-bottom:14px; }
    .field:last-child { margin-bottom:0; }
    .field label { display:block; font-weight:700; font-size:0.92rem; margin-bottom:6px; }
    .field .hint { font-weight:400; color:var(--muted); font-size:0.8rem; }
    .field input, .field textarea { width:100%; padding:11px 12px; border:1px solid #ddd; border-radius:10px; font-family:'Rubik',sans-serif; font-size:0.95rem; direction:rtl; background:#fff; }
    .field textarea { min-height:90px; resize:vertical; line-height:1.6; }
    .toggle { display:flex; gap:8px; }
    .toggle button { flex:1; padding:10px; border:1px solid #ddd; border-radius:10px; background:#fff; cursor:pointer; font-family:'Rubik',sans-serif; font-size:0.9rem; font-weight:500; }
    .toggle button.active { background:var(--primary); color:#fff; border-color:var(--primary); }
    .btn { width:100%; padding:13px; border:none; border-radius:12px; font-family:'Rubik',sans-serif; font-size:1rem; font-weight:700; cursor:pointer; margin-top:6px; }
    .btn-primary { background:var(--gold); color:#fff; }
    .btn-primary:disabled { opacity:.55; cursor:default; }
    .btn-ghost { background:transparent; color:var(--muted); font-weight:500; font-size:0.85rem; }
    .status { margin-top:12px; padding:11px 13px; border-radius:10px; font-size:0.9rem; display:none; }
    .status.show { display:block; }
    .status.loading { background:#eef1f8; color:#3a4a7a; }
    .status.success { background:#eaf7ee; color:#1f7a3d; }
    .status.error { background:#fdecec; color:#b02121; }
    .brand { font-size:0.8rem; color:var(--muted); text-align:center; margin-top:8px; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>ניהול תוכן · זמני השבת</h1>
  <div class="sub">מה שתערוך כאן יופיע באתר לכל הקהילה מיד. הזמנים, הפרשה והמולד מחושבים אוטומטית — כאן עורכים רק תוכן.</div>

  <!-- Login -->
  <div class="card" id="login-card" style="display:none">
    <div class="field" style="margin-bottom:12px">
      <label>סיסמת ניהול</label>
      <input type="password" id="pw" placeholder="הסיסמה שקיבלת" onkeydown="if(event.key==='Enter')doLogin()" />
    </div>
    <button class="btn btn-primary" onclick="doLogin()">כניסה</button>
    <div class="status" id="login-status"></div>
  </div>

  <!-- Editor -->
  <div id="editor" style="display:none">
    <div class="card">
      <div class="field">
        <label>נושא השיעור <span class="hint">(ברירת מחדל: הלכות שבת)</span></label>
        <input type="text" id="f-shiur" placeholder="הלכות שבת" />
      </div>
      <div class="field">
        <label>הודעות לקהילה <span class="hint">(בר מצווה, ברית, אזכרה, שמחות — יופיע בראש הדף. ריק = לא מוצג)</span></label>
        <textarea id="f-messages" placeholder="לדוגמה: בר המצווה של משפחת כהן — קידושא רבא לאחר התפילה"></textarea>
      </div>
      <div class="field">
        <label>קידוש <span class="hint">(טקסט קצר בטיימליין. ריק = מוצג נושא השיעור)</span></label>
        <input type="text" id="f-kidush" placeholder="" />
      </div>
    </div>

    <div class="card">
      <div class="field">
        <label>דבר תורה / הלכה</label>
        <textarea id="f-dvar" style="min-height:150px"></textarea>
      </div>
      <div class="field">
        <label>מקור</label>
        <input type="text" id="f-dvar-source" placeholder="מקור: ..." />
      </div>
    </div>

    <div class="card">
      <div class="field">
        <label>שעון קיץ <span class="hint">(אוטומטי מזהה לבד; שנה רק אם צריך לכפות)</span></label>
        <div class="toggle" id="summer-toggle">
          <button type="button" data-val="null" onclick="setSummer(null)">אוטומטי</button>
          <button type="button" data-val="true" onclick="setSummer(true)">קיץ</button>
          <button type="button" data-val="false" onclick="setSummer(false)">חורף</button>
        </div>
      </div>
    </div>

    <button class="btn btn-primary" id="save-btn" onclick="save()">💾 שמור ופרסם</button>
    <button class="btn btn-ghost" onclick="logout()">התנתק</button>
    <div class="status" id="status"></div>
  </div>

  <div class="brand">קהילת אורות ישראל 🦾</div>
</div>

<script data-cfasync="false">
  let summerValue = null;
  const $ = (id) => document.getElementById(id);
  const key = () => localStorage.getItem('admin_key') || '';

  function status(el, msg, type) { const e = $(el); e.className = 'status show ' + type; e.innerText = msg; }
  function setSummer(v) {
    summerValue = v;
    document.querySelectorAll('#summer-toggle button').forEach((b) => b.classList.toggle('active', String(b.dataset.val) === String(v)));
  }

  async function loadContent() {
    const r = await fetch('/api/content', { cache: 'no-store' });
    const c = r.ok ? await r.json() : {};
    $('f-shiur').value = c.shiur_topic || '';
    $('f-messages').value = c.messages || '';
    $('f-kidush').value = c.kidush || '';
    $('f-dvar').value = c.dvar_torah || '';
    $('f-dvar-source').value = c.dvar_source || '';
    setSummer(c.is_summer ?? null);
  }

  async function showEditor() {
    $('login-card').style.display = 'none';
    $('editor').style.display = 'block';
    await loadContent();
  }

  async function doLogin() {
    const password = $('pw').value;
    if (!password) return;
    status('login-status', 'בודק...', 'loading');
    try {
      const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password }) });
      if (!r.ok) { status('login-status', 'סיסמה שגויה', 'error'); return; }
      localStorage.setItem('admin_key', password);
      await showEditor();
    } catch (e) { status('login-status', 'שגיאה: ' + e.message, 'error'); }
  }

  function logout() {
    localStorage.removeItem('admin_key');
    $('editor').style.display = 'none';
    $('login-card').style.display = 'block';
    $('pw').value = '';
  }

  async function save() {
    const v = (id) => $(id).value.trim();
    const body = {
      shiur_topic: v('f-shiur'),
      messages: v('f-messages'),
      kidush: v('f-kidush'),
      dvar_torah: v('f-dvar'),
      dvar_source: v('f-dvar-source'),
      is_summer: summerValue,
    };
    $('save-btn').disabled = true;
    status('status', 'שומר...', 'loading');
    try {
      const r = await fetch('/api/content', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-key': key() },
        body: JSON.stringify(body),
      });
      if (r.status === 401) { status('status', 'ההרשאה פגה — התחבר מחדש.', 'error'); logout(); return; }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      status('status', 'נשמר ופורסם! ✅ האתר כבר מעודכן.', 'success');
    } catch (e) {
      status('status', 'שגיאה בשמירה: ' + e.message, 'error');
    } finally {
      $('save-btn').disabled = false;
    }
  }

  // Auto-enter if already logged in on this device.
  if (key()) { showEditor().catch(() => { $('login-card').style.display = 'block'; }); }
  else { $('login-card').style.display = 'block'; }
</script>
</body>
</html>
